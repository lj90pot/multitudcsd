[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multitudcsd"
version = "0.1.0"
description = "Ingesta y procesamiento de datos de movilidad durante el CSD (pride) de Berlin"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests==2.32.3",
    "gtfs-realtime-bindings==1.0.0",
    "h3==4.1.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
#librerias opcionales solo en local.
#reinstalarlos rompe el cluster databricks
local = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "pandas>=2.2,<2.3",
    "numpy<2"
]
dev = ["pytest==8.3.3", "ruff==0.6.9", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # errores, pyflakes, orden de imports

[project.scripts]
multitudcsd-bronze = "multitudcsd.orchestration.run_bronze:main"
multitudcsd-stream = "multitudcsd.orchestration.run_stream:main"
multitudcsd-silver = "multitudcsd.orchestration.run_silver:main"
multitudcsd-gold = "multitudcsd.orchestration.run_gold:main"